name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # =========================================================================
  # 1. CONTINUOUS INTEGRATION: Schema Verification, Testing & Production Build
  # =========================================================================
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "mysql://ci:ci@localhost:3306/kd_infovision"

      - name: Run Schema & CMS Model Verification
        run: npm test

      - name: Build Next.js Production Bundle
        run: npm run build
        env:
          DATABASE_URL: "mysql://ci:ci@localhost:3306/kd_infovision"
          JWT_SECRET: "ci-build-secret-key-32-characters"
          NEXT_TELEMETRY_DISABLED: 1

  # =========================================================================
  # 2. CONTINUOUS DEPLOYMENT: Multi-Target Production Deployment
  # =========================================================================
  cd:
    name: Continuous Deployment
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # Option A: Automated Docker Build & Push to GitHub Container Registry
      # (Zero configuration required - uses built-in GITHUB_TOKEN)
      # ---------------------------------------------------------------------
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------------------------------------------------------------------
      # Option B: Automated Vercel Deployment (Triggers if VERCEL_TOKEN exists)
      # ---------------------------------------------------------------------
      - name: Deploy to Vercel Production
        if: env.VERCEL_TOKEN != ''
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # ---------------------------------------------------------------------
      # Option C: SSH / VPS Deployment (Triggers if DEPLOY_HOST & DEPLOY_KEY exist)
      # ---------------------------------------------------------------------
      - name: Deploy to VPS / Cloud Server via SSH
        if: env.DEPLOY_HOST != '' && env.DEPLOY_KEY != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER || 'root' }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            cd /var/www/kd-infovision || exit 1
            git pull origin main
            npm ci --production=false
            npx prisma generate
            npm run build
            pm2 reload kd-infovision || pm2 start npm --name "kd-infovision" -- start
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
