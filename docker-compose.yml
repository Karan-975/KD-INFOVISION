services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: kd-infovision-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: kd_infovision
      MYSQL_USER: kduser
      MYSQL_PASSWORD: kdpassword123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kd-infovision-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "mysql://kduser:kdpassword123@mysql:3306/kd_infovision"
      JWT_SECRET: "replace-with-a-secure-random-secret-in-production"
      NODE_ENV: "production"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
