<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="kdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D9BE9" />
      <stop offset="60%" stop-color="#1B3A6B" />
      <stop offset="100%" stop-color="#0F2347" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EC3F5" />
      <stop offset="100%" stop-color="#3D9BE9" />
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="128" height="128" rx="28" fill="url(#kdGrad)" />
  
  <!-- Subtle inner border highlight -->
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2" />

  <!-- "KD" Monogram -->
  <text 
    x="64" 
    y="78" 
    text-anchor="middle" 
    fill="#FFFFFF" 
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
    font-size="52" 
    font-weight="900" 
    letter-spacing="-1.5"
  >
    KD
  </text>

  <!-- Glowing Tech Node Accent -->
  <circle cx="100" cy="34" r="7" fill="#5EC3F5" />
  <circle cx="100" cy="34" r="12" fill="none" stroke="rgba(94, 195, 245, 0.4)" stroke-width="2" />
</svg>
